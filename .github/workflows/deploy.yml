name: Deploy to Server

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      # Test backend
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -qs

      # Test data collector
      - name: Install data collector dependencies
        working-directory: data-collector
        run: pip install -r requirements.txt

      - name: Run data collector unit tests
        working-directory: data-collector
        run: pytest -qs

      # Test frontend
      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --ci

      # Integration tests
      - name: Build integration test containers
        run: docker compose -f docker-compose.test.yml build
      - name: Run integration tests
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from integration_tests

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/waiver-watcher"
      - name: Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /waiver-watcher
            docker compose pull
            docker compose up -d --build
